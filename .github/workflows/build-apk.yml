name: Build Android APK and Windows Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Assets for Capacitor
        run: |
          npm install
          node scripts/prepare-dist.js

      - name: Add Capacitor Android Platform & Apply Custom Metal App Icons
        run: |
          npx cap add android
          cp -r assets/android-res/* android/app/src/main/res/
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.audio.low_latency" android:required="false" />' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Easy Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk chordcamp-debug.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chordcamp-android-apk
          path: chordcamp-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v2.0.0
          name: "ChordCamp Pro v2.0.0 — Tuner, Studio FX & Scores"
          body: |
            ## 🎸 ChordCamp Pro v2.0.0 Release

            ### 📱 Mobile Installation Options:
            1. **Instant Web App (PWA - Recommended)**:
               Open **[https://ayhanmehrzad.github.io/ChordCamp-Pro/](https://ayhanmehrzad.github.io/ChordCamp-Pro/)** on your phone (Chrome / Safari), then tap **"Install App"** or **"Add to Home Screen"**.
            2. **Android APK**:
               Download `chordcamp-debug.apk` below and install directly onto your Android device with microphone permissions enabled for the Tuner & Listener!

            ### 🪟 Windows Desktop:
            - **Installer (Recommended)**: Download `ChordCampSetup.exe` below for 1-click installation with optional **"Launch on Windows Startup"** and automatic Desktop/Start Menu shortcuts.
            - **Standalone**: Download `ChordCamp.exe` for instant dedicated standalone window.
          files: |
            chordcamp-debug.apk
            ChordCampSetup.exe
            ChordCamp.exe
            install-windows.bat
            launch-windows.bat
            chordcamp.sh
          draft: false
          prerelease: false
