name: Build Android APK and Windows Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Assets for Capacitor
        run: |
          npm install
          node scripts/prepare-dist.js

      - name: Add Capacitor Android Platform & Apply Custom Metal App Icons
        run: |
          npx cap add android
          cp -r assets/android-res/* android/app/src/main/res/
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Easy Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk chordcamp-debug.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chordcamp-android-apk
          path: chordcamp-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.1.0
          name: "ChordCamp Pro v1.1.0 — Studio Guitar Tuner, Visual Metronome & 133+ Chords"
          body: |
            ## 🎸 ChordCamp Pro v1.1.0 Release

            ### 🚀 What's New in v1.1.0:
            - **🎸 Studio Guitar Tuner**: Real-time microphone pitch detection with analog cents needle gauge, target guidance, and 8 tuning presets (Standard, Drop D, Half-Step Down, DADGAD, Open D, Open G, Chromatic).
            - **🥁 Visual Groove Metronome**: Smooth mechanical pendulum, large measure beat counter with accents, live subdivision grid, and interactive beginner guitar strumming coach!
            - **🎼 133+ Comprehensive Chords**: Added all sharp/flat voicings across C#, D#, F#, G#, A#/Bb (Major, Minor, 7ths, Maj7, m7, sus4, sus2, add9, dim7, power chords) with beginner easy shapes!
            - **🔍 Redesigned Studio Search Toolbar**: Clean full-width search with instant clear and enharmonic matching.
            - **⚡ Seamless 1-Click In-App Updates**: No need to uninstall or delete the app! Tap "Update App" or run `Update-Windows.bat`.

            ### 📱 Android Installation:
            1. **Instant Web App (PWA)**:
               Open **[https://ayhanmehrzad.github.io/ChordCamp-Pro/](https://ayhanmehrzad.github.io/ChordCamp-Pro/)** on your phone (Chrome / Samsung Internet), then tap **"Install App"** or **"Add to Home screen"**. (Updates automatically in the background!)
            2. **Native Android APK**:
               Download `chordcamp-debug.apk` below and install directly onto your Android device.

            ### 🪟 Windows Desktop:
            - **Installer**: Download `ChordCampSetup.exe` below for 1-click install or in-place upgrade (no uninstall needed).
            - **Portable**: Download `ChordCamp.exe` for the standalone native system window.
            - **Instant Updater**: Run `Update-Windows.bat`.
          files: |
            chordcamp-debug.apk
            ChordCampSetup.exe
            ChordCamp.exe
            Install-Windows.bat
            Update-Windows.bat
            launch-windows.bat
            chordcamp.sh
          draft: false
          prerelease: false
