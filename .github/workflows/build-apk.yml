name: Build Android APK and Windows Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install

      - name: Add Capacitor Android Platform & Sync Web Assets
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chordcamp-android-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "ChordCamp Pro v1.0.0"
          body: |
            ## 🎸 ChordCamp Pro v1.0.0 Release
            
            ### 📱 Mobile Installation Options:
            1. **Instant Web App (PWA - Recommended)**:
               Open **[https://ayhanmehrzad.github.io/ChordCamp-Pro/](https://ayhanmehrzad.github.io/ChordCamp-Pro/)** on your phone (Chrome / Safari), then tap **"Install App"** or **"Add to Home Screen"**.
            2. **Android APK**:
               Download `app-debug.apk` below and install directly onto your Android device.
            
            ### 🪟 Windows Desktop:
            - Download `ChordCamp.exe` below for the dedicated offline desktop app window.
          files: |
            android/app/build/outputs/apk/debug/*.apk
            ChordCamp.exe
            launch-windows.bat
            chordcamp.sh
          draft: false
          prerelease: false
